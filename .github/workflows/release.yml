name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ok-nick/setup-aftman@v0.4.2
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EthosDex
          path: dist/EthosDex.lua
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/EthosDex.lua --title "Ethos Dex $GITHUB_REF_NAME" --generate-notes
